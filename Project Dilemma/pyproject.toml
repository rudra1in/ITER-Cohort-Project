[project]
name = "offline-proctoring"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aam-ashim-abinash", email = "ashimabinashmishra2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=0.37.1",
    "insightface>=1.0.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.61.1",
    "onnxruntime>=1.23.0",git 
]

[project.scripts]
offline-proctoring = "offline_proctoring:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
